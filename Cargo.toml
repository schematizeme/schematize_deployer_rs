[package]
name = "schematize-deployer"
version = "0.5.0"
edition = "2021"
description = "schematize Deployer: chaves SSH, VPS e acesso remoto AUDITADO, com a credencial fora do alcance do agente. Funciona sozinho; integra-se ao schematize quando os dois convivem."
license = "MIT"

[lib]
name = "deployer"
path = "src/lib.rs"

# UM repo, DOIS binários (ADR-0010). No schematize a CLI e a GUI ficaram em repos separados,
# e isso custa `packaging/gui-pin.txt`, `Cargo.lock` pinado entre repos e `--precise` no
# release — três mecanismos só para casar as duas metades. Aqui elas se casam por construção.
[[bin]]
name = "schematize-deployer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encoder PNG — gera o ícone do app A PARTIR DO CÓDIGO, sem asset externo nem
# rasterizador (que falha em SVG). Mesma escolha do schematize.
png = "0.18"
# DB local dos hosts. Mesmas duas formas do schematize: `sqlite-embutido` (default, o que os
# releases usam — roda em qualquer distro) ou `sqlite-do-sistema` (o certo pra quem compila
# do fonte na própria máquina; o instalador detecta e escolhe).
rusqlite = { version = "0.31", default-features = false }

# ---- COFRE (ADR-0010) ----
# Argon2id: derivação de chave a partir da passphrase. É o que o piso 3 da casa manda para
# senha, e o que torna força-bruta cara mesmo com o blob na mão de quem tem o disco.
argon2 = "0.5"
# XChaCha20-Poly1305: AEAD com nonce de 24 bytes — grande o bastante para nonce ALEATÓRIO
# sem contador. Com AES-GCM (12 bytes) um nonce repetido quebra a confidencialidade, e manter
# contador correto entre processos é a espécie de estado que se erra em silêncio.
chacha20poly1305 = "0.10"
# Zerar a chave da memória no drop. Não é paranoia: sem isto ela sobrevive em heap liberado
# e vai parar em core dump e em arquivo de swap.
zeroize = { version = "1", features = ["derive"] }
# CSPRNG do sistema para salt e nonce (piso 3: nunca gerador previsível).
getrandom = "0.2"
# Ler a passphrase SEM eco. Sem isto ela aparece na tela, e daí no screenshot, no
# compartilhamento de tela e no histórico do terminal de quem colou.
rpassword = "7"
# Cliente HTTP EM PROCESSO — e o "em processo" é a razão, não a conveniência.
# Chamar `curl` com `-H "Authorization: Bearer <token>"` põe o token no argv, e argv é
# legível por qualquer processo da máquina via `ps` — inclusive o agente que este cofre
# existe para manter longe do segredo. `ureq` é bloqueante (este app não é async), leva
# rustls (sem OpenSSL do sistema) e mantém o token dentro do processo.
ureq = { version = "2", features = ["json", "tls"], default-features = false }
# Só para devolver o SIGPIPE ao padrão do Unix — ver a nota em `main.rs`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Perfil de release IDÊNTICO ao dos outros repos do app — e isso não é estética.
# O install.sh compila todos com um `CARGO_TARGET_DIR` único; cargo só reaproveita
# um artefato se o perfil bater EXATAMENTE. Qualquer divergência aqui (um `opt-level`
# que seja) parte o cache compartilhado e a economia evapora.
[profile.release]
strip = true
opt-level = 3
lto = "thin"

[features]
default = ["sqlite-embutido"]
sqlite-embutido = ["rusqlite/bundled"]
sqlite-do-sistema = []
